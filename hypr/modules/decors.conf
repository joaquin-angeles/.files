animations { 
    enabled = true

    # Animation presets
    bezier = linear, 1, 1, 1, 1
    bezier = wind, 0.05, 0.69, 0.1, 1
    bezier = winIn, 0.1, 1.1, 0.1, 1
    bezier = winOut, 0.3, 1, 0, 1

    # Fade animations
    animation = fadeIn, 1, 6, default
    animation = fadeOut, 1, 6, winOut
    
    # Window animations
    animation = windowsMove, 1, 3, wind, slide
    animation = windowsIn, 1, 3, winIn, popin 95%
    animation = windowsOut, 1, 3, winOut, popin 95%

    # Other animations
    animation = layers, 0
    animation = workspaces, 1, 3, linear, fade
}

# Disable decorations & effects
decoration {
    # Blur configurations
    blur {
        enabled = true
        size = 5
        passes = 2
    }

    # Border radius
    rounding = 0
    rounding_power = 2

    # Active & inactive differentiator
    inactive_opacity = 0.8
}

decoration:shadow {
    # Lightweight dark shadows
    enabled = true
    range = 8
}

# Window decorations
general {

    # Monadtall
    layout = master

    # Optimized compositor settings
    allow_tearing = false

    # Window gaps
    gaps_in = 6
    gaps_out = 12

    # Border configuration (currently disabled)
    border_size = 0
    # col.active_border = rgb(7daea3) rgb(a9b665) 45deg
    # col.inactive_border = rgba(3c3836cc)
}

# 60% estate for master window
master {
    mfact = 0.65
}

# Sliding layers
layerrule = animation slide, waybar
layerrule = animation slide, mako

# Window rules
windowrulev2 = noblur, focus:0
windowrulev2 = rounding 5, floating:1

# Smart borders
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
windowrulev2 = noshadow, floating:0, onworkspace:w[t1]
windowrulev2 = noshadow, floating:0, onworkspace:w[tg1]
