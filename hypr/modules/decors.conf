animations { 
    enabled = true

    # Animation presets
    bezier = linear, 1, 1, 1, 1
    bezier = wind, 0.05, 0.69, 0.1, 1
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1

    # Fade animations
    animation = fadeIn, 1, 8, easeOutQuint
    animation = fadeOut, 1, 4, easeInOutCubic

    # Window animations
    animation = windowsMove, 0
    animation = windowsIn, 0
    animation = windowsOut, 0

    # Other animations
    # animation = layers, 0
    animation = workspaces, 1, 3, linear, fade
}

# Disable decorations & effects
decoration {
    # Blur configurations
    blur {
        enabled = true
        size = 5
        passes = 2
    }

    # Border radius
    rounding = 0
    rounding_power = 2

    # Active & inactive differentiator
    # inactive_opacity = 0.8
}

decoration:shadow {
    # Lightweight dark shadows
    enabled = true
    range = 4
}

# Window decorations
general {

    # Monadtall
    layout = master

    # Optimized compositor settings
    allow_tearing = false

    # Window gaps
    gaps_in = 6
    gaps_out = 12

    # Border configuration (currently disabled)
    border_size = 1
    col.active_border = rgb(404344)
    col.inactive_border = rgba(1d2021cc)
}

master {
    new_status = master
    mfact = 0.50
}

group {
    col.border_active = rgba(7daea3bf)
    col.border_inactive = rgba(40434480)
    groupbar {
        render_titles = false
        indicator_height = 3
        font_size = 15
        text_color = rgb(d4be98)
        col.active = rgb(404344)
        col.inactive = rgba(1d2021cc)
    }
}

# Layers
# layerrule = match:namespace ^(waybar)$, blur on

# Window rules
windowrule = match:float 1, rounding 7
# windowrule = match:focus 0, border_size 0
# windowrule = match:focus 0, no_blur on

# Smart borders
workspace = w[t1], gapsout:0, gapsin:0, border:0, rounding:0, shadow:0
workspace = w[tg1], gapsout:0, gapsin:0, border:0, rounding:0, shadow:0
workspace = f[1], gapsout:0, gapsin:0, border:0, rounding:0, shadow:0
