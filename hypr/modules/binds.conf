# Default apps
$browser = bash -c 'zen || flatpak run app.zen_browser.zen'
$fileManager = nautilus
$menu = rofi -show drun
$mod = SUPER
$term = alacritty

# App shortcuts
bind = CTRL ALT, B, exec, bluelight.sh
bind = $mod, b, exec, $browser
bind = $mod, e, exec, $fileManager
bind = $mod, PERIOD, exec, rofi -show emoji
bind = $mod, r, exec, hyprctl reload
bind = $mod, s, exec, grim - | wl-copy && notify-send "Screenshot saved" "Image copied to clipboard"
bind = $mod, w, exec, bash -c "pgrep waybar >/dev/null && pkill waybar || waybar &"
bind = $mod, n, exec, bash -c 'if makoctl mode | grep -q do-not-disturb; then makoctl mode -r do-not-disturb && notify-send "DND Off" "Notifications enabled"; else makoctl mode -a do-not-disturb && notify-send "DND On" "Notifications silenced"; fi'
bind = $mod SHIFT, e, exec, power-menu.sh
bind = $mod SHIFT, p, exec, hyprpicker -a
bind = $mod SHIFT, s, exec, region-capture.sh
bind = $mod, V, exec, cliphist list | rofi -dmenu -p 'clipboard' | cliphist decode | wl-copy # Clipboard keybinding

# Volume & Brightness Control
bind = $mod, F9, exec, swayosd-client --brightness lower
bind = $mod, F10, exec, swayosd-client --brightness raise
bind = $mod, F11, exec, swayosd-client --output-volume lower
bind = $mod, F12, exec, swayosd-client --output-volume raise
bind = $mod SHIFT, F12, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindl = , XF86MonBrightnessUp, exec, swayosd-client --brightness lower
bindl = , XF86MonBrightnessDown, exec, swayosd-client --brightness raise

# Window & Session Management
bind = $mod, RETURN, exec, $term
bind = $mod, SPACE, exec, $menu
bind = $mod SHIFT, SPACE, exec, cheatsheet.sh | rofi -dmenu -p 'keybinds'
bind = $mod, f, fullscreen
bind = $mod, q, killactive
bind = $mod SHIFT, f, togglefloating

# Window movement
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r
bind = $mod CTRL, h, moveintogroup, l
bind = $mod CTRL, j, moveintogroup, d
bind = $mod CTRL, k, moveintogroup, u
bind = $mod CTRL, l, moveintogroup, r
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window navigation 
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
bind = $mod, G, exec, hyprctl --batch "dispatch togglegroup ; dispatch forcerendererreload"
bind = $mod, TAB, changegroupactive, f
bind = $mod SHIFT, TAB, changegroupactive, b

# Workspace Management
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
